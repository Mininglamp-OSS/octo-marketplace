name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/migrate-marketplace]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.x"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: octo_marketplace
        ports:
          - 3306:3306
        # Disposable schemas are replayed for each integration test. Avoid
        # runner disk contention without weakening transaction flush settings.
        options: >-
          --tmpfs /var/lib/mysql:rw
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/octo_marketplace?parseTime=true&multiStatements=true
      MIGRATION_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/octo_marketplace_rehearsal_ci?parseTime=true&multiStatements=true
      MIGRATION_TEST_MYSQL_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Smoke test development Octo stub
        run: python3 scripts/dev-octo-stub-smoke.py
      - name: Configure test MySQL redo capacity
        # Both database suites replay the schema in isolated databases. Keep
        # their DDL load from exhausting MySQL 8's default 100 MiB redo capacity.
        run: >-
          docker exec -e MYSQL_PWD=root "${{ job.services.mysql.id }}"
          mysql -uroot -e "SET GLOBAL innodb_redo_log_capacity = 1073741824;"
      - name: Test
        run: go test -v -race -shuffle=on -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Validate Compose
        run: docker compose config >/dev/null

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m
