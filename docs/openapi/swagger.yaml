    get:
      description: List every category with usage counts, including empty ones.
      operationId: admin_expert_category.list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_Mininglamp-OSS_octo-marketplace_internal_api_response.Data-array_github_com_Mininglamp-OSS_octo-marketplace_internal_service_expert_AdminCategory'
