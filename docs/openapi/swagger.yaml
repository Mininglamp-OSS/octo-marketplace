              schema:
                $ref: '#/components/schemas/github_com_Mininglamp-OSS_octo-marketplace_internal_api_response.Error'
          description: 'FORBIDDEN: mode=space requires the Space owner/admin role'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_Mininglamp-OSS_octo-marketplace_internal_api_response.Error'
          description: NOT_FOUND
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_Mininglamp-OSS_octo-marketplace_internal_api_response.Error'
          description: RATE_LIMITED
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_Mininglamp-OSS_octo-marketplace_internal_api_response.Error'
          description: INTERNAL_ERROR
      security:
      - Bearer: []
      summary: List plugin review requests
      tags:
      - plugin
    post:
      description: 'Freezes the reviewed content under a caller-supplied version label.
        When the authenticated Space''s automatic-review policy is enabled (the default),
        the request is approved immediately and the published Plugin is updated; otherwise
        it remains pending for a Space owner/admin. Content is supplied one of three
        ways: (1) parse_task_id for a skill zip upload processed server-side; (2)
        manifest_json and plugin_json together for declared JSON documents; (3) neither,
        which snapshots the live draft row and is valid only while the plugin is private.
        Only the plugin owner may submit, only one request per plugin may be pending,
        and a version label already published for that plugin is refused.'
      operationId: plugin.review_request.create
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/internal_api_handler_plugin.reviewSubmitRequest'
                description: Submission
                summary: payload
        description: Submission
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_Mininglamp-OSS_octo-marketplace_internal_api_response.Data-internal_api_handler_plugin_reviewRequestResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_Mininglamp-OSS_octo-marketplace_internal_api_response.Error'
          description: 'VALIDATION_ERROR: missing/invalid fields; parse_task_id is
            mutually exclusive with manifest_json and is only valid for skills; listed
            plugins require content'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_Mininglamp-OSS_octo-marketplace_internal_api_response.Error'
          description: AUTH_REQUIRED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_Mininglamp-OSS_octo-marketplace_internal_api_response.Error'
          description: FORBIDDEN
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_Mininglamp-OSS_octo-marketplace_internal_api_response.Error'
          description: NOT_FOUND
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_Mininglamp-OSS_octo-marketplace_internal_api_response.Error'
          description: 'CONFLICT: a request is already pending, or the version label
            is already published'
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_Mininglamp-OSS_octo-marketplace_internal_api_response.Error'
          description: PAYLOAD_TOO_LARGE
