  /plugins/review_requests:
    get:
      description: mode=mine lists the caller's own submissions; mode=space lists
        every request in the Space and requires the Space owner/admin role. Both are
        always scoped to the Space of the request.
      operationId: plugin.review_request.list
      parameters:
      - description: List mode
        in: query
        name: mode
        required: true
        schema:
          enum:
          - mine
          - space
          type: string
      - description: Filter by status
        in: query
        name: status
        schema:
          enum:
          - pending
          - approved
          - rejected
          - canceled
          type: string
      - description: Page number, default 1
        in: query
        name: page
        schema:
          type: integer
      - description: Page size, default 20, max 100
        in: query
        name: page_size
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
